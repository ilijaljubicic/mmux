name: test

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev pkg-config

      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: ${{ runner.os }}-${{ runner.arch }}-homebrew-tmux-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-homebrew-tmux-

      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew_bin="$(brew --prefix)/bin"
          echo "$brew_bin" >> "$GITHUB_PATH"
          export PATH="$brew_bin:$PATH"
          if ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          brew link tmux || true
          command -v tmux
          tmux -V
          tmux -L mmux-ci-smoke new-session -d -s mmux-ci-smoke-session 'sleep 30'
          tmux -L mmux-ci-smoke has-session -t mmux-ci-smoke-session
          tmux -L mmux-ci-smoke kill-session -t mmux-ci-smoke-session

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
