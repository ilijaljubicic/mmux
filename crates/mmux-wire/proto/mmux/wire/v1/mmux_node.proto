syntax = "proto3";

package mmux.wire.v1;

service MmuxNodeRegistryService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc PullCommands(PullCommandsRequest) returns (PullCommandsResponse);
  rpc SubmitCommandResult(SubmitCommandResultRequest) returns (SubmitCommandResultResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message RegisterNodeRequest {
  NodeDescriptor descriptor = 1;
}

message NodeDescriptor {
  string node_id = 1;
  string display_name = 2;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string message = 2;
}

message PullCommandsRequest {
  string node_id = 1;
}

message PullCommandsResponse {
  repeated NodeCommand commands = 1;
}

message NodeCommand {
  string command_id = 1;
  oneof kind {
    TmuxCommand tmux = 2;
    ReadFileCommand read_file = 3;
    WriteFileCommand write_file = 4;
    ShutdownCommand shutdown = 5;
  }
}

message TmuxCommand {
  repeated string args = 1;
}

message ReadFileCommand {
  string path = 1;
  optional uint64 offset = 2;
  uint64 limit = 3;
}

message WriteFileCommand {
  string path = 1;
  string content_base64 = 2;
  bool append = 3;
}

message ShutdownCommand {}

message SubmitCommandResultRequest {
  string node_id = 1;
  string command_id = 2;
  NodeCommandResult result = 3;
}

message NodeCommandResult {
  oneof kind {
    TmuxOutput tmux_output = 1;
    FileContent file_content = 2;
    WriteComplete write_complete = 3;
    CommandError error = 4;
  }
}

message TmuxOutput {
  string output = 1;
}

message FileContent {
  string content_base64 = 1;
}

message WriteComplete {
  uint64 bytes_written = 1;
}

message CommandError {
  string message = 1;
}

message SubmitCommandResultResponse {
  bool accepted = 1;
}

message HeartbeatRequest {
  string node_id = 1;
  NodeStatus status = 2;
}

message NodeStatus {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_READY = 1;
    KIND_BUSY = 2;
    KIND_DRAINING = 3;
    KIND_UNHEALTHY = 4;
  }

  Kind kind = 1;
  string message = 2;
}

message HeartbeatResponse {
  bool accepted = 1;
}
