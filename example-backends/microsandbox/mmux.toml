[microsandbox.runtime]
image = "debian:bookworm-slim"
# memory_mib = 1024
# cpus = 2

[microsandbox.assets]
tmux_conf = "./mmux_sources/assets/tmux.conf"

# Runtime config for prepared snapshots. Use mmux-setup.toml to build the
# snapshot from a stock image, then bundle-launch with this config.

[microsandbox.network]
default_egress = "deny"
default_ingress = "deny"
# The launcher automatically allows the controller URL when it targets
# host.microsandbox.internal, including the URL port. Add rules here only for
# extra access that this sandbox should have.
#
# Do not mutate this runtime config for setup. Use mmux-setup.toml for
# first-time preparation, or mmux-image.toml.example with a prepared image.
# trust_host_cas = true

# [[microsandbox.volumes]]
# name = "my-data"
# quota_mib = 5120
# [[microsandbox.volumes.labels]]
# key = "env"
# value = "dev"

# [[microsandbox.mounts]]
# kind = "named"
# guest = "/data"
# name = "my-data"
# readonly = false
# noexec = false

[[microsandbox.secrets]]
env = "MMUX_CONTROLLER_TOKEN"
value_from = "host.MMUX_TOKEN"
allowed_host = "host.microsandbox.internal"
placeholder = "$MSB_MMUX_CONTROLLER_TOKEN"
inject_headers = false
inject_basic_auth = false
inject_query = false
inject_body = false
require_tls_identity = false

