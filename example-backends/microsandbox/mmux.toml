# [[microsandbox.volumes.labels]]
# key = "env"
# value = "dev"

# [[microsandbox.mounts]]
# kind = "named"
# guest = "/data"
# name = "my-data"
# readonly = false
# noexec = false

[[microsandbox.secrets]]
env = "MMUX_CONTROLLER_TOKEN"
value_from = "host.MMUX_TOKEN"
allowed_host = "192.168.12.176"
placeholder = "$MSB_MMUX_CONTROLLER_TOKEN"
inject_headers = false
inject_basic_auth = false
inject_query = false
inject_body = false
require_tls_identity = false

