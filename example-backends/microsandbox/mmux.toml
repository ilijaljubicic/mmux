[sandbox.runtime]
image = "debian:bookworm-slim"
# memory_mib = 1024
# cpus = 2

# Runtime config for prepared snapshots. Use microsandbox-setup.toml to build the
# snapshot from a stock image, then bundle-launch with this config.

[sandbox.network]
default_egress = "deny"
default_ingress = "deny"
# The launcher automatically allows the controller URL when it targets the
# sandbox host alias, including the URL port. Add rules here only for extra
# access that this sandbox should have.
#
# trust_host_cas = true

# Optional OpenAI runtime access. Domain rules keep this narrower than
# destination_group = "public"; DNS is policy-gated too under default deny.
# [[sandbox.network.egress]]
# action = "allow"
# destination_domain = "api.openai.com"
# protocol = "udp"
# ports = [53]
#
# [[sandbox.network.egress]]
# action = "allow"
# destination_domain = "api.openai.com"
# protocol = "tcp"
# ports = [443]

# [[sandbox.volumes]]
# name = "my-data"
# quota_mib = 5120
# [[sandbox.volumes.labels]]
# key = "env"
# value = "dev"

# [[sandbox.mounts]]
# kind = "named"
# guest = "/data"
# name = "my-data"
# readonly = false
# noexec = false

[[sandbox.secrets]]
env = "MMUX_CONTROLLER_TOKEN"
value_from = "host.MMUX_TOKEN"
allowed_host = "host.microsandbox.internal"
placeholder = "$MSB_MMUX_CONTROLLER_TOKEN"
inject_headers = false
inject_basic_auth = false
inject_query = false
inject_body = false
require_tls_identity = false

